    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f4fa;
            padding: 14px;
            color: #1a2332;
        }
        .app {
            max-width: 880px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.07);
            padding: 24px 22px 32px;
            transition: all 0.2s;
        }
        h1 {
            font-size: 25px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.3px;
            color: #0b1a33;
            margin-bottom: 4px;
        }
        .sub {
            font-size: 14px;
            color: #4d6a8f;
            margin-bottom: 22px;
            border-left: 4px solid #2a7de1;
            padding-left: 14px;
            background: #f0f6ff;
            border-radius: 0 10px 10px 0;
            line-height: 1.6;
            padding: 8px 14px;
        }
        .search-box {
            position: relative;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 6px;
        }
        .field {
            flex: 1 1 180px;
            min-width: 140px;
            position: relative;
        }
        .field label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #2c3e5a;
            margin-bottom: 5px;
            letter-spacing: 0.3px;
        }
        .field input,
        .field select {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            border: 2px solid #dce3ed;
            border-radius: 16px;
            background: #fafcff;
            transition: 0.2s;
            color: #0b1a33;
            appearance: auto;
        }
        .field input:focus,
        .field select:focus {
            outline: none;
            border-color: #2a7de1;
            box-shadow: 0 0 0 4px rgba(42, 125, 225, 0.12);
            background: #fff;
        }
        .field input::placeholder {
            color: #a8b8cf;
        }

        .suggestions {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: #fff;
            border: 2px solid #dce3ed;
            border-radius: 14px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            display: none;
            padding: 4px 0;
        }
        .suggestions.show {
            display: block;
        }
        .suggestions .item {
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 1px solid #f0f4fa;
            transition: 0.1s;
        }
        .suggestions .item:hover {
            background: #e8f0fe;
            color: #1a3b6b;
        }
        .suggestions .item:last-child {
            border-bottom: none;
        }
        .suggestions .item .match {
            font-weight: 600;
            color: #0b1a33;
        }
        .suggestions .item .hint {
            color: #7a91b0;
            font-size: 12px;
            margin-left: 8px;
        }

        .btn {
            background: #1a3b6b;
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 14px 34px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 14px rgba(26, 59, 107, 0.25);
            flex: 0 0 auto;
            align-self: flex-end;
            margin-bottom: 2px;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .btn:hover {
            background: #0f2a4f;
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(26, 59, 107, 0.3);
        }
        .btn:active {
            transform: scale(0.97);
        }

        .result-area {
            margin-top: 22px;
            border-top: 2px solid #eef3f9;
            padding-top: 18px;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #3d5779;
            background: #f2f7fe;
            padding: 10px 18px;
            border-radius: 14px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 6px 16px;
            align-items: center;
        }
        .stats span {
            font-weight: 500;
        }
        .stats .highlight {
            color: #1a3b6b;
            font-weight: 700;
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 620px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .card-list::-webkit-scrollbar {
            width: 5px;
        }
        .card-list::-webkit-scrollbar-thumb {
            background: #c9d7e9;
            border-radius: 10px;
        }

        .card {
            border-radius: 18px;
            padding: 14px 18px;
            border: 1.5px solid #e7eef7;
            transition: 0.15s;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px 14px;
            background: #fafdff;
            position: relative;
        }
        .card:hover {
            border-color: #b8cee8;
            background: #f5faff;
            transform: translateX(2px);
        }
        .card .left {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 14px;
            flex: 2 1 220px;
        }
        .card .left .rank {
            font-size: 22px;
            font-weight: 800;
            min-width: 32px;
            text-align: center;
            line-height: 1;
            color: #4d6a8f;
            font-feature-settings: "tnum";
        }
        .card .left .rank.gold {
            color: #b8860b;
            font-size: 26px;
        }
        .card .left .rank.silver {
            color: #4a7db5;
            font-size: 24px;
        }
        .card .left .rank.bronze {
            color: #8e44ad;
            font-size: 24px;
        }

        .card .left .carrier {
            font-weight: 700;
            font-size: 16px;
            color: #0b1a33;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card .left .carrier .badge {
            font-size: 10px;
            background: #dce6f2;
            padding: 2px 10px;
            border-radius: 30px;
            font-weight: 500;
            color: #1f3d66;
        }
        .card .left .origin {
            font-size: 13.5px;
            color: #2e4a72;
        }
        .card .left .origin strong {
            font-weight: 600;
            color: #0f2a4f;
        }

        .card .right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            flex: 1 0 auto;
            justify-content: flex-end;
        }
        .card .right .price {
            font-size: 20px;
            font-weight: 700;
            color: #0f2a4f;
            letter-spacing: -0.2px;
            white-space: nowrap;
        }
        .card .right .price small {
            font-size: 13px;
            font-weight: 400;
            color: #5e7a9e;
        }
        .card .right .tag {
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 30px;
            font-weight: 600;
            white-space: nowrap;
        }
        .tag.best {
            background: #f7e9b0;
            color: #7a5d0a;
        }
        .tag.good {
            background: #d4e4f7;
            color: #1f4a7a;
        }
        .tag.nice {
            background: #e8d5f5;
            color: #6b3a8a;
        }

        .card.rank-1 {
            background: linear-gradient(135deg, #fff9e6 0%, #fff3cd 100%);
            border-color: #f0d060;
            box-shadow: 0 4px 16px rgba(212, 175, 55, 0.15);
        }
        .card.rank-2 {
            background: linear-gradient(135deg, #f0f7ff 0%, #dce8f8 100%);
            border-color: #8ab3e0;
            box-shadow: 0 4px 16px rgba(74, 125, 181, 0.12);
        }
        .card.rank-3 {
            background: linear-gradient(135deg, #f6f0fc 0%, #e8daf5 100%);
            border-color: #c9a8d9;
            box-shadow: 0 4px 16px rgba(142, 68, 173, 0.10);
        }

        .empty {
            text-align: center;
            padding: 48px 12px;
            color: #6a7f9e;
            font-size: 15px;
            line-height: 1.8;
        }
        .empty .icon {
            font-size: 44px;
            display: block;
            margin-bottom: 12px;
        }
        .loading {
            text-align: center;
            padding: 30px;
            color: #2a7de1;
            font-weight: 500;
        }

            margin-top: 20px;
            font-size: 12px;
            color: #8399b8;
            text-align: center;
            border-top: 1px solid #eaf0f8;
            padding-top: 16px;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .app {
                padding: 16px 14px;
                border-radius: 20px;
            }
            h1 {

            }
            .search-box {
                gap: 10px;
            }
            .field {

                min-width: 0;
            }
            .btn {

                justify-content: center;
                padding: 14px;
                white-space: normal;
            }
            .card {
                padding: 12px 14px;
                flex-direction: column;
                align-items: stretch;
            }
            .card .left {
                flex: 1 1 auto;
                gap: 6px 10px;
            }
            .card .right {
                justify-content: space-between;
                border-top: 1px dashed #dce3ed;
                padding-top: 10px;
                margin-top: 4px;
            }
            .card .right .price {
                font-size: 18px;
            }
            .stats {
                font-size: 13px;
                padding: 8px 14px;
            }
            .card .left .rank {
                font-size: 18px;
                min-width: 26px;
            }
            .card .left .rank.gold {
                font-size: 22px;
            }
            .card .left .rank.silver,
            .card .left .rank.bronze {
                font-size: 20px;
            }
        }
        @media (max-width: 400px) {
            .card .left .carrier {
                font-size: 14px;
            }
            .card .right .price {
                font-size: 16px;
            }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2f4a;
            color: #fff;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            z-index: 999;
            max-width: 92%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        </div>

        <div class="result-area" id="resultArea">

            <div id="resultList" class="card-list">

                </div>
            </div>
        </div>

        <div class="footer-note">

            <br /> 实际运费以账单为准，软件开发人赵辉涛
        </div>
    </div>

            if (!originProv || !destProv) return false;
            if (originProv === destProv) return true;
            if (YRD.has(originProv) && YRD.has(destProv)) return true;
            if (JJJ.has(originProv) && JJJ.has(destProv)) return true;
            return false;
        }

        function queryAll(dest, weight) {
            const results = [];
            const w = parseFloat(weight);
            if (!dest || isNaN(w) || w < 0.5) return results;

            const normalized = normalizeDest(dest);

            // 顺丰
            for (const [origin, destMap] of Object.entries(SF_DATA)) {
                const matched = matchDest(normalized, destMap);
                if (matched) {
                    const price = calcSF(destMap[matched], w);
                    if (isFinite(price)) {
                        results.push({
                            carrier: '顺丰',
                            origin: origin,
                            dest: matched,
                            price: Math.round(price * 100) / 100,
                            raw: price,
                            type: '顺丰'
                        });
                    }
                }
            }

            // 韵达
            for (const [origin, destMap] of Object.entries(YD_DATA)) {
                const matched = matchDest(normalized, destMap);
                if (matched) {
                    const price = calcYD(destMap[matched], w);
                    if (isFinite(price) && w >= 20) {
                        results.push({
                            carrier: '韵达快运',
                            origin: origin,
                            dest: matched,
                            price: Math.round(price * 100) / 100,
                            raw: price,
                            type: '韵达'
                        });
                    }
                }
            }

            // 德邦大票电商 (100kg+)
            if (w >= 100) {
                for (const [origin, destMap] of Object.entries(DB_DP_DATA)) {
                    const matched = matchDest(normalized, destMap);
                    if (matched) {
                        const price = calcDB_DP(destMap[matched], w);
                        if (isFinite(price)) {
                            results.push({
                                carrier: '德邦大票电商',
                                origin: origin,
                                dest: matched,
                                price: Math.round(price * 100) / 100,
                                raw: price,
                                type: '德邦大票'
                            });
                        }
                    }
                }
            }

            // 德邦重货特惠
            for (const [origin, destMap] of Object.entries(DB_ZH_DATA)) {
                const matched = matchDest(normalized, destMap);
                if (matched) {
                    const price = calcDB_ZH(destMap[matched], w);
                    if (isFinite(price)) {
                        results.push({
                            carrier: '德邦重货特惠',
                            origin: origin,
                            dest: matched,
                            price: Math.round(price * 100) / 100,
                            raw: price,
                            type: '德邦重货'
                        });
                    }
                }
            }

            // 德邦大件360
            for (const [origin, destMap] of Object.entries(DB_XJ_DATA)) {
                const matched = matchDest(normalized, destMap);
                if (matched) {
                    const price = calcDB_XJ(destMap[matched], w);
                    if (isFinite(price)) {
                        results.push({
                            carrier: '德邦大件360',
                            origin: origin,
                            dest: matched,
                            price: Math.round(price * 100) / 100,
                            raw: price,
                            type: '德邦小件'
                        });
                    }
                }
            }

            // 跨越速运 (增加跨省过滤)
            for (const [mode, origins] of Object.entries(KY_DATA)) {
                for (const [origin, destMap] of Object.entries(origins)) {
                    const matched = matchDest(normalized, destMap);
                    if (matched) {
                        // 获取始发地省份和目的地省份
                        const originProv = DEST_MAP[origin] || origin;
                        const destProv = DEST_MAP[matched] || matched;
                        // 检查是否允许该跨省线路
                        if (!isAllowedKY(originProv, destProv)) {
                            continue; // 跳过不允许的跨省
                        }
                        const price = calcKY(destMap[matched], w);
                        if (isFinite(price) && w >= 20) {
                            const modeLabel = mode === '同城' ? '同城次日' : mode === '省内' ? '省内次日' : '隔日达';
                            results.push({
                                carrier: `跨越${modeLabel}`,
                                origin: origin,
                                dest: matched,
                                price: Math.round(price * 100) / 100,
                                raw: price,
                                type: '跨越'
                            });
                        }
                    }
                }
            }

            results.sort((a, b) => a.raw - b.raw);
            return results;
        }

        // ============================================================
        //  5. UI 交互 (复用)
        // ============================================================

        const destInput = document.getElementById('destInput');
        const weightInput = document.getElementById('weightInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultList = document.getElementById('resultList');
        const countDisplay = document.getElementById('countDisplay');
        const minPriceDisplay = document.getElementById('minPriceDisplay');
        const bestCarrierDisplay = document.getElementById('bestCarrierDisplay');
        const suggestionsBox = document.getElementById('suggestions');
        const toast = document.getElementById('toast');

        let toastTimer = null;

        function showToast(msg) {
            if (toastTimer) clearTimeout(toastTimer);
            toast.textContent = msg;
            toast.classList.add('show');
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2800);
        }

        destInput.addEventListener('input', function() {
            const val = this.value.trim();
            if (val.length < 1) {
                suggestionsBox.classList.remove('show');
                return;
            }
            const suggestions = getSuggestions(val);
            if (suggestions.length === 0) {
                suggestionsBox.classList.remove('show');
                return;
            }
            let html = '';
            for (const s of suggestions) {
                const highlight = s.display.replace(new RegExp(val, 'gi'), match => `<span class="match">${match}</span>`);
                html += `<div class="item" data-dest="${s.dest}" data-display="${s.display}">${highlight} <span class="hint">→ ${s.dest}</span></div>`;
            }
            suggestionsBox.innerHTML = html;
            suggestionsBox.classList.add('show');
        });

        suggestionsBox.addEventListener('click', function(e) {
            const item = e.target.closest('.item');
            if (!item) return;
            const display = item.dataset.display || item.dataset.dest;
            destInput.value = display;
            suggestionsBox.classList.remove('show');
            doSearch();
        });

        document.addEventListener('click', function(e) {
            if (!e.target.closest('#destInput') && !e.target.closest('.suggestions')) {
                suggestionsBox.classList.remove('show');
            }
        });

        function render(results, weight) {
            if (!results || results.length === 0) {
                resultList.innerHTML = `
                    <div class="empty">
                        <span class="icon">📭</span>
                        未找到匹配线路<br />
                        请检查目的地是否正确，或尝试更宽泛的关键词<br />
                        <small style="color:#99aec9;">（支持：省份、城市、区县名）</small>
                    </div>
                `;
                countDisplay.textContent = '0';
                minPriceDisplay.textContent = '—';
                bestCarrierDisplay.textContent = '—';
                return;
            }

            const best = results[0];
            countDisplay.textContent = results.length;
            minPriceDisplay.textContent = `¥${best.price.toFixed(2)}`;
            bestCarrierDisplay.textContent = `${best.carrier} · ${best.origin}`;

            let html = '';
            for (let i = 0; i < results.length; i++) {
                const r = results[i];
                const rank = i + 1;
                let rankClass = '';
                let rankLabel = `${rank}`;
                let tagHtml = '';
                let cardClass = '';

                if (rank === 1) {
                    rankClass = 'gold';
                    rankLabel = '🥇 1';
                    tagHtml = '<span class="tag best">🏆 最优</span>';
                    cardClass = 'rank-1';
                } else if (rank === 2) {
                    rankClass = 'silver';
                    rankLabel = '🥈 2';
                    tagHtml = '<span class="tag good">⭐ 推荐</span>';
                    cardClass = 'rank-2';
                } else if (rank === 3) {
                    rankClass = 'bronze';
                    rankLabel = '🥉 3';
                    tagHtml = '<span class="tag nice">👍 优选</span>';
                    cardClass = 'rank-3';
                } else {
                    rankLabel = `${rank}`;
                    tagHtml = `<span class="tag" style="background:#eef3f9;color:#4d6a8f;">#${rank}</span>`;
                }

                html += `
                    <div class="card ${cardClass}">
                        <div class="left">
                            <div class="rank ${rankClass}">${rankLabel}</div>
                            <div class="carrier">
                                ${r.carrier}
                                <span class="badge">${r.type}</span>
                            </div>
                            <div class="origin">
                                📍 <strong>${r.origin}</strong> → ${r.dest}
                            </div>
                            <div style="font-size:11px;color:#7a91b0;">${weight}kg</div>
                        </div>
                        <div class="right">
                            <div class="price">¥${r.price.toFixed(2)} <small>元</small></div>
                            ${tagHtml}
                        </div>
                    </div>
                `;
            }
            resultList.innerHTML = html;
        }

        function doSearch() {
            const dest = destInput.value.trim();
            const weight = parseFloat(weightInput.value);

            if (!dest) {
                showToast('⚠️ 请输入收货目的地');
                return;
            }
            if (isNaN(weight) || weight < 0.5) {
                showToast('⚠️ 请输入有效重量 (≥0.5kg)');
                return;
            }

            suggestionsBox.classList.remove('show');

            resultList.innerHTML = `<div class="loading">⏳ 正在遍历所有线路 …</div>`;

            setTimeout(() => {
                const results = queryAll(dest, weight);
                render(results, weight);
                if (results.length === 0) {
                    showToast('🔍 未找到匹配线路，试试更宽泛的关键词');
                } else {
                    showToast(`✅ 找到 ${results.length} 条线路，最低 ¥${results[0].price.toFixed(2)}`);
                }
            }, 80);
        }

        searchBtn.addEventListener('click', doSearch);
        destInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
        weightInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

        let searching = false;
        const origSearch = doSearch;
        doSearch = function() {
            if (searching) return;
            searching = true;
            origSearch();
            setTimeout(() => { searching = false; }, 500);
        };
        searchBtn.addEventListener('click', doSearch);

        window.addEventListener('load', () => {
            setTimeout(doSearch, 400);
        });

        console.log('🚚 运费速算引擎 v5.0 · 跨越仅保留本省市、江浙沪皖、京津冀');
        console.log(`✅ 顺丰: ${Object.keys(SF_DATA).length} 个始发地`);
        console.log(`✅ 韵达: 南京→江浙沪皖`);
        console.log(`✅ 德邦大票: ${Object.keys(DB_DP_DATA).length} 个始发地`);
        console.log(`✅ 德邦重货: ${Object.keys(DB_ZH_DATA).length} 个始发地`);
        console.log(`✅ 德邦小件: ${Object.keys(DB_XJ_DATA).length} 个始发地`);
        console.log(`✅ 跨越: 同城${Object.keys(KY_DATA.同城).length} 省内${Object.keys(KY_DATA.省内).length} 隔日${Object.keys(KY_DATA.隔日).length} (已过滤跨省)`);
    </script>
</body>
</html>
